[project]
name = "contrigent-api"
version = "0.1.0"
description = "HTTP API for Contrigent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "openai-agents>=0.19.4",
    "pydantic",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contrigent_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
